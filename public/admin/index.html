<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTMedya Media Vault</title><style>
body{font-family:Inter,system-ui,sans-serif;margin:0;background:#090909;color:#eee}header{padding:20px 24px;border-bottom:1px solid #292929;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#090909;z-index:3}.wrap{max-width:1300px;margin:auto;padding:24px}.panel{border:1px solid #292929;border-radius:16px;padding:18px;margin-bottom:20px;background:#111}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{border:1px solid #292929;border-radius:14px;overflow:hidden;background:#0f0f0f}.thumb{width:100%;aspect-ratio:16/10;object-fit:cover;background:#050505}.meta{padding:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.btn,input,select,textarea{background:#151515;color:#eee;border:1px solid #383838;border-radius:10px;padding:10px}.btn{cursor:pointer}.primary{background:#eee;color:#111}.drop{border:2px dashed #444;padding:34px;text-align:center;border-radius:14px}.hidden{display:none}.muted{color:#999;font-size:13px}label{display:block;margin:8px 0 4px;color:#aaa}.login{max-width:420px;margin:12vh auto}.status{font-size:13px;color:#9f9}</style></head><body>
<header><strong>BTMEDYA / MEDIA VAULT</strong><button class="btn" id="logout">Çıkış</button></header><main class="wrap"><section id="login" class="panel login"><h2>Arşiv Yönetimi</h2><p class="muted">BTMedya medya kitaplığına giriş.</p><input id="pw" type="password" placeholder="Yönetici şifresi" style="width:100%;box-sizing:border-box"><button class="btn primary" id="loginBtn" style="margin-top:10px">Giriş yap</button><p id="loginMsg"></p></section>
<section id="app" class="hidden"><div class="panel"><h2>Toplu medya yükle</h2><div class="drop" id="drop">Dosyaları buraya bırak veya <input id="files" type="file" multiple accept="image/*,video/*,audio/*,.pdf"></div><div class="row" style="margin-top:12px"><select id="category"><option value="arsiv">Arşiv</option><option value="haber">Haber</option><option value="siyah-oda">Siyah Oda</option><option value="ai-lab">AI LAB</option><option value="portre">Portre</option><option value="web">Web Sitesi</option><option value="sosyal">Sosyal Medya</option></select><button class="btn primary" id="uploadBtn">Yüklemeyi başlat</button></div><p id="uploadStatus" class="status"></p></div>
<div class="panel"><h2>Haber yayınla</h2><p class="muted">Statik arşive ek olarak, D1 üzerinden canlı haber yayınlar (isteğe bağlı — data/haberler.json statik arşivi etkilemez).</p>
<label>Başlık</label><input id="nTitle" style="width:100%;box-sizing:border-box" placeholder="Haber başlığı">
<label>Slug (URL)</label><input id="nSlug" style="width:100%;box-sizing:border-box" placeholder="orn-haber-basligi">
<label>Kategori</label><input id="nCategory" style="width:100%;box-sizing:border-box" placeholder="Yerel / Ekonomi / ...">
<label>Özet</label><textarea id="nExcerpt" style="width:100%;box-sizing:border-box"></textarea>
<label>Gövde</label><textarea id="nBody" style="width:100%;box-sizing:border-box;min-height:140px"></textarea>
<div class="row" style="margin-top:10px"><button class="btn" id="nDraft">Taslak kaydet</button><button class="btn primary" id="nPublish">Yayınla</button></div>
<p id="nStatus" class="status"></p></div>
<div class="panel"><div class="row"><input id="q" placeholder="Arşivde ara…" style="flex:1"><select id="filter"><option value="">Tüm kategoriler</option><option value="haber">Haber</option><option value="siyah-oda">Siyah Oda</option><option value="ai-lab">AI LAB</option><option value="portre">Portre</option><option value="web">Web Sitesi</option><option value="sosyal">Sosyal</option></select><button class="btn" id="refresh">Yenile</button><a class="btn" href="/api/export">AI JSON dışa aktar</a></div></div><div id="grid" class="grid"></div></section></main>
<script>
const $=s=>document.querySelector(s);let selected=[];
async function req(url,opt){const r=await fetch(url,opt);if(r.status===401){showLogin();throw Error('auth')}return r.json()}
function showLogin(){ $('#login').classList.remove('hidden');$('#app').classList.add('hidden');}
async function init(){try{await req('/api/media');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load()}catch(e){}}
$('#loginBtn').onclick=async()=>{let r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#pw').value})});if(r.ok)init();else $('#loginMsg').textContent='Şifre hatalı';};
$('#logout').onclick=()=>{fetch('/api/logout').then(()=>location.reload())};
$('#files').onchange=e=>selected=[...e.target.files];$('#drop').ondragover=e=>e.preventDefault();$('#drop').ondrop=e=>{e.preventDefault();selected=[...e.dataTransfer.files];$('#drop').firstChild.textContent=`${selected.length} dosya seçildi`};
$('#uploadBtn').onclick=async()=>{if(!selected.length)return;let cat=$('#category').value;for(let i=0;i<selected.length;i++){let f=selected[i];$('#uploadStatus').textContent=`${i+1}/${selected.length}: ${f.name}`;let meta=await req('/api/media',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({original_name:f.name,mime:f.type||'application/octet-stream',size:f.size,category:cat})});let part=10*1024*1024,parts=[];for(let off=0,n=1;off<f.size;off+=part,n++){let blob=f.slice(off,Math.min(off+part,f.size));let p=await fetch(`/api/upload/${encodeURIComponent(meta.key)}/part?uploadId=${encodeURIComponent(meta.uploadId)}&partNumber=${n}`,{method:'PUT',body:blob});if(!p.ok)throw Error(await p.text());parts.push(await p.json())}await req(`/api/upload/${encodeURIComponent(meta.key)}/complete?uploadId=${encodeURIComponent(meta.uploadId)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({parts})})}selected=[];$('#uploadStatus').textContent='Tamamlandı';load()};
async function load(){let qs=new URLSearchParams();if($('#q').value)qs.set('q',$('#q').value);if($('#filter').value)qs.set('category',$('#filter').value);let d=await req('/api/media?'+qs);$('#grid').innerHTML=d.items.map(x=>`<article class="card"><${x.mime.startsWith('video/')?'video controls':'img'} class="thumb" src="${x.url}" ${x.mime.startsWith('video/')?'':'alt="'+(x.alt_text||x.original_name)+'"'}></${x.mime.startsWith('video/')?'video':'img'}><div class="meta"><b>${x.title||x.original_name}</b><div class="muted">${x.category} · ${(x.size/1024/1024).toFixed(1)} MB</div><div class="row" style="margin-top:8px"><button class="btn" onclick="togglePub('${x.id}',${x.published})">${x.published?'Yayından çıkar':'Siteye ekle'}</button><button class="btn" onclick="editMedia('${x.id}',${JSON.stringify(x).replace(/"/g,'&quot;')})">Düzenle</button><button class="btn" onclick="del('${x.id}')">Sil</button></div></div></article>`).join('')}
async function togglePub(id,p){await req('/api/media/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({published:!p})});load()}
async function editMedia(id,x){let title=prompt('Başlık',x.title||'');if(title===null)return;let slot=prompt('Site alanı (hero, haber-kapak, siyah-oda, ai-lab, galeri...)',x.slot||'');if(slot===null)return;let tags=prompt('Etiketler (virgülle)',(x.tags||[]).join(', '));if(tags===null)return;let alt=prompt('Alt metin',x.alt_text||'');if(alt===null)return;await req('/api/media/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({title,slot,alt_text:alt,tags:tags.split(',').map(v=>v.trim()).filter(Boolean),category:x.category,published:!!x.published,sort_order:x.sort_order||0,description:x.description||''})});load()}async function del(id){if(confirm('Bu medya kalıcı silinsin mi?')){await req('/api/media/'+id,{method:'DELETE'});load()}}$('#refresh').onclick=load;$('#q').oninput=()=>load();$('#filter').onchange=load;init();

function slugify(s){return s.toLowerCase().replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
$('#nTitle').addEventListener('input',()=>{if(!$('#nSlug').dataset.touched)$('#nSlug').value=slugify($('#nTitle').value)});
$('#nSlug').addEventListener('input',()=>{$('#nSlug').dataset.touched='1'});
async function saveNews(status){
  const b={title:$('#nTitle').value.trim(),slug:$('#nSlug').value.trim(),category:$('#nCategory').value.trim(),excerpt:$('#nExcerpt').value.trim(),body:$('#nBody').value.trim(),status};
  if(!b.title||!b.slug){$('#nStatus').textContent='Başlık ve slug zorunlu';return}
  $('#nStatus').textContent='Kaydediliyor…';
  try{
    const r=await fetch('/api/admin/news',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});
    const d=await r.json();
    if(!r.ok||!d.ok){$('#nStatus').textContent='Hata: '+(d.error||r.status);return}
    $('#nStatus').textContent=status==='published'?'Yayınlandı ✓':'Taslak kaydedildi ✓';
  }catch(e){$('#nStatus').textContent='Hata: '+e.message}
}
$('#nDraft').onclick=()=>saveNews('draft');
$('#nPublish').onclick=()=>saveNews('published');
</script></body></html>
