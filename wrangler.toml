# Cloudflare Workers Builds bu adı yok sayar ve daima bağlı olduğu servise
# (btmedya-db) deploy eder. Alan adı bu Worker'a taşındığında push'lar doğrudan
# canlı siteyi günceller.
name = "btmedya-db"
main = "src/worker.js"
compatibility_date = "2026-09-02"

[observability]
enabled = true

# Statik dosyalar public/ altında tutulur. Böylece wrangler.toml, src/ ve
# migrations/ gibi backend dosyaları hiçbir koşulda herkese açık servis edilmez
# (.assetsignore'a gerek kalmaz).
[assets]
directory = "public"
binding = "ASSETS"
# Eşleşen bir statik dosya varsa Cloudflare Worker'ı hiç çalıştırmaz ve dosyayı
# doğrudan sunar. Bu, indekslenen HTML sayfalarında iki soruna yol açıyordu:
#   1. /haberler/ — panelden yapılan düzenleme ve video kütüphanesi anahtarı
#      ancak Worker çalışırsa geçerli olur.
#   2. www.btmedya.com.tr — Worker'daki www -> apex 301 yönlendirmesi hiç
#      çalışmıyordu, çünkü statik dosya Worker'dan önce servis ediliyordu. Sonuç:
#      her sayfa iki ayrı adreste 200 dönüyordu (yinelenen içerik).
# Bu yüzden yalnızca indekslenen HTML adreslerinde Worker öne alınır. Görseller,
# styles.css, script.js ve /assets/* eskisi gibi doğrudan servis edilmeye devam
# eder. Kayıt bulunamazsa Worker zaten env.ASSETS.fetch ile statik sürüme
# düşüyor, yani yedek korunuyor.
run_worker_first = ["/", "/haberler/*", "/hakkimizda*", "/iletisim*"]

# ALAN ADI YÖNLENDİRMESİ — routes bloğu bilerek KAPALI.
# Alan adı panelden Custom Domain olarak eklenir. Routes burada açılırsa
# wrangler paneldeki alan adı bağlantılarının tek yetkilisi olur ve mevcut
# ayarları EZER — gereksiz risk.
#
# Custom Domain eklemek için:
# Workers & Pages > btmedya-db > Settings > Domains & Routes > Add > Custom Domain

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "btmedya-media"

[[d1_databases]]
binding = "DB"
database_name = "btmedya-media"
database_id = "94a980cd-62c5-4c29-b7fc-40f96ab665e4"

[vars]
MEDIA_PUBLIC_TTL = "86400"

# Secrets — bu dosyaya YAZILMAZ, `wrangler secret put` ile eklenir:
#   ADMIN_PASSWORD        -> /admin/ giriş şifresi
#   ADMIN_SESSION_SECRET  -> oturum çerezi imzalama anahtarı
#   MEDIA_SIGNING_SECRET  -> /media/ imzalı bağlantı anahtarı
#   AI_READ_TOKEN         -> (opsiyonel) salt-okunur AI erişim token'ı
#   RESEND_API_KEY        -> (opsiyonel) Resend e-posta bildirimi API anahtarı
#   RESEND_TO             -> (opsiyonel) bildirim alıcı adresi (varsayılan: busetuncay1029@gmail.com)
#   RESEND_FROM           -> (opsiyonel) gönderici adresi (varsayılan: BTMEDYA <noreply@btmedya.com.tr>)
