name = "btmedya-db"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# DNS/route bağlama bilinçli olarak burada tanımlanmıyor; alan adı
# Cloudflare panelinden yönetiliyor (bkz. docs/CANLIYA-ALMA.md).

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "btmedya-media"
database_id = "94a980cd-62c5-4c29-b7fc-40f96ab665e4"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "btmedya-media"

# Secrets (wrangler secret put ile ayrı tanımlanır, buraya YAZILMAZ):
#   ADMIN_PASSWORD, ADMIN_SESSION_SECRET, MEDIA_SIGNING_SECRET, AI_READ_TOKEN (opsiyonel)
