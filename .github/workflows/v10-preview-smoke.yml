name: V10 Preview Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate V10 source files
        run: |
          set -eu
          test -s public/v10/index.html
          test -s public/v10/v10.css
          test -s public/v10/v10.js
          grep -Fq 'hero-scrub.mp4' public/v10/index.html
          grep -Fq '/api/public/media' public/v10/v10.js
          grep -Fq '/api/news' public/v10/v10.js

      - name: Wait for Cloudflare deployment
        run: sleep 45

      - name: Check V10 production URLs
        run: |
          set -eu
          urls=(
            'https://btmedya.com.tr/v10/index.html'
            'https://btmedya.com.tr/v10/'
            'https://btmedya.com.tr/api/health'
          )
          for url in "${urls[@]}"; do
            echo "Checking $url"
            status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --max-time 20 "$url")
            echo "HTTP $status"
            test "$status" = '200'
          done
